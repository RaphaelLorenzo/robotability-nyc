<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paris robotability map</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    :root {
      --bg: #12141a;
      --panel: #1c2029;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #7cb342;
      --border: #2c3340;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
    }
    #app { display: grid; grid-template-columns: 360px 1fr; height: 100%; }
    #sidebar {
      background: var(--panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; min-height: 0;
    }
    #sidebar header {
      padding: 16px 18px 12px; border-bottom: 1px solid var(--border);
    }
    #sidebar h1 {
      margin: 0 0 4px; font-size: 18px; font-weight: 600; letter-spacing: 0.01em;
    }
    #sidebar .sub { color: var(--muted); font-size: 12px; line-height: 1.4; }
    .controls {
      padding: 12px 18px; display: grid; gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    label {
      font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--muted);
    }
    select {
      width: 100%; margin-top: 4px; padding: 8px 10px;
      border-radius: 6px; border: 1px solid var(--border);
      background: #0f1218; color: var(--text); font-size: 14px;
    }
    #status { font-size: 12px; color: var(--muted); min-height: 1.2em; }
    #detail {
      padding: 12px 18px 24px; overflow: auto; flex: 1; min-height: 0;
    }
    #detail h2 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
    #detail .scoreline {
      display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; font-size: 13px;
    }
    #detail .pill {
      background: #0f1218; border: 1px solid var(--border);
      border-radius: 999px; padding: 4px 10px;
    }
    #detail .pill strong { color: var(--accent); font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 14px; }
    th, td {
      text-align: left; padding: 6px 8px;
      border-bottom: 1px solid var(--border); vertical-align: top;
    }
    th {
      position: sticky; top: 0; background: var(--panel);
      color: var(--muted); font-weight: 600; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    td.col-name { color: var(--text); word-break: break-word; max-width: 150px; }
    td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .placeholder { color: var(--muted); font-size: 13px; line-height: 1.5; }
    #map { width: 100%; height: 100%; }
    .legend {
      position: absolute; right: 16px; bottom: 28px; z-index: 2;
      background: rgba(28, 32, 41, 0.92); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px; color: var(--text);
      font-size: 12px; min-width: 160px;
    }
    .legend .title {
      margin-bottom: 6px; color: var(--muted); font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .legend .bar {
      height: 10px; border-radius: 4px; margin-bottom: 4px;
      background: linear-gradient(to right, #440154, #3b528b, #21918c, #5ec962, #fde725);
    }
    .legend .ticks { display: flex; justify-content: space-between; color: var(--muted); }
    @media (max-width: 860px) {
      #app { grid-template-columns: 1fr; grid-template-rows: 45% 55%; }
      #sidebar { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header>
        <h1>Paris robotability</h1>
        <div class="sub">
          Click a feature to inspect every CSV column (raw + 0–1 normalized within the active level).
        </div>
      </header>
      <div class="controls">
        <div>
          <label for="level">Aggregation level</label>
          <select id="level"></select>
        </div>
        <div id="status">Loading…</div>
      </div>
      <div id="detail">
        <p class="placeholder">Select a level, then click a sidewalk, tile, or district on the map.</p>
      </div>
    </aside>
    <div style="position: relative;">
      <div id="map"></div>
      <div class="legend">
        <div class="title">robotability_score_01</div>
        <div class="bar"></div>
        <div class="ticks"><span>0</span><span>1</span></div>
      </div>
    </div>
  </div>
  <script>
    const COLUMN_ORDER = __COLUMN_ORDER__;
    const AVAILABLE_LEVELS = __AVAILABLE_LEVELS__;
    const DEFAULT_LEVEL = __DEFAULT_LEVEL__;
    const LEVEL_LABELS = {
      sidewalk_full: "Sidewalk (full polygon)",
      sidewalk_segmentized: "Sidewalk (segmentized points)",
      qa: "Quartier administratif",
      pvp: "PVP tile",
      arrondissement: "Arrondissement",
    };

    const viridis = [
      [68, 1, 84], [72, 40, 120], [62, 74, 137], [49, 104, 142],
      [38, 130, 142], [31, 158, 137], [53, 183, 121], [109, 205, 89],
      [180, 222, 44], [253, 231, 37]
    ];

    function lerpColor(t) {
      const x = Math.min(1, Math.max(0, t));
      const scaled = x * (viridis.length - 1);
      const i = Math.floor(scaled);
      const f = scaled - i;
      const a = viridis[i];
      const b = viridis[Math.min(i + 1, viridis.length - 1)];
      const rgb = a.map((v, idx) => Math.round(v + (b[idx] - v) * f));
      return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
    }

    function formatValue(v) {
      if (v === null || v === undefined || v === "") return "—";
      if (typeof v === "number") {
        if (!Number.isFinite(v)) return "—";
        if (Number.isInteger(v)) return String(v);
        const abs = Math.abs(v);
        if (abs !== 0 && (abs < 1e-3 || abs >= 1e4)) return v.toExponential(3);
        return v.toFixed(4).replace(/\.?0+$/, "");
      }
      return String(v);
    }

    const META = new Set([
      "point_index", "segment_index", "sidewalk_id", "pvp_tile", "arrondissement_id",
      "arrondissement", "qa_n_sq_qu", "qa_c_qu", "qa_c_quinsee", "qa_l_qu", "qa_c_ar",
      "qa_n_sq_ar", "width_m", "lon", "lat", "iu_ac"
    ]);
    const COMPONENT_SCORES = new Set([
      "crowd_dynamics_zti_score",
      "crowd_dynamics_tourism_score",
      "intersection_safety_zone_score",
    ]);

    function columnGroup(name) {
      if (name === "robotability_score" || name === "robotability_score_01") return 4;
      if (name.endsWith("_contribution")) return 3;
      if (META.has(name)) return 0;
      if (
        name.endsWith("_raw") ||
        name.endsWith("_flag") ||
        name.includes("_elevation") ||
        name.includes("_distance") ||
        name.includes("_occupation") ||
        COMPONENT_SCORES.has(name)
      ) {
        return 2;
      }
      return 1;
    }

    const GROUP_NAMES = {
      0: "Metadata",
      1: "Feature scores (0–1 inputs)",
      2: "Raw / component inputs",
      3: "Weighted contributions",
      4: "Robotability",
    };

    function rowFromAttrs(attrs, featureId, fallbackProps) {
      if (!attrs || !attrs.ids) return null;
      const idx = attrs.idIndex[String(featureId)];
      if (idx === undefined) return null;
      const values = {};
      const values01 = {};
      for (const col of attrs.columns) {
        values[col] = attrs.raw[col][idx];
        values01[col] = attrs.n01[col][idx];
      }
      return {
        feature_id: attrs.ids[idx],
        feature_label: attrs.labels[idx],
        robotability_score: fallbackProps.robotability_score,
        robotability_score_01: fallbackProps.robotability_score_01,
        values,
        values_01: values01,
      };
    }

    function renderDetail(props) {
      const detail = document.getElementById("detail");
      if (!props || !props.values) {
        detail.innerHTML = `<p class="placeholder">No attributes for this feature.</p>`;
        return;
      }
      const values = props.values;
      const values01 = props.values_01 || {};
      const cols = COLUMN_ORDER.filter((c) => Object.prototype.hasOwnProperty.call(values, c));
      const byGroup = { 0: [], 1: [], 2: [], 3: [], 4: [] };
      for (const c of cols) byGroup[columnGroup(c)].push(c);

      let html = `<h2>${props.feature_label || props.feature_id || "Feature"}</h2>`;
      html += `<div class="scoreline">
        <span class="pill">score <strong>${formatValue(props.robotability_score)}</strong></span>
        <span class="pill">0–1 <strong>${formatValue(props.robotability_score_01)}</strong></span>
      </div>`;

      for (const g of [0, 1, 2, 3, 4]) {
        const list = byGroup[g];
        if (!list.length) continue;
        html += `<table><thead><tr>
          <th>${GROUP_NAMES[g]}</th><th>Raw</th><th>0–1</th>
        </tr></thead><tbody>`;
        for (const c of list) {
          html += `<tr>
            <td class="col-name">${c}</td>
            <td class="num">${formatValue(values[c])}</td>
            <td class="num">${formatValue(values01[c])}</td>
          </tr>`;
        }
        html += `</tbody></table>`;
      }
      detail.innerHTML = html;
    }

    function extendBounds(bounds, coords) {
      if (!Array.isArray(coords) || coords.length === 0) return;
      if (typeof coords[0] === "number") {
        bounds.extend(coords);
        return;
      }
      for (const item of coords) extendBounds(bounds, item);
    }

    const map = new maplibregl.Map({
      container: "map",
      style: {
        version: 8,
        sources: {
          basemap: {
            type: "raster",
            tiles: ["https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png"],
            tileSize: 256,
            attribution: "&copy; OpenStreetMap &copy; CARTO",
          },
        },
        layers: [{ id: "basemap", type: "raster", source: "basemap" }],
      },
      center: [2.3522, 48.8566],
      zoom: 11.4,
    });
    map.addControl(new maplibregl.NavigationControl(), "top-right");

    const levelSelect = document.getElementById("level");
    for (const level of AVAILABLE_LEVELS) {
      const opt = document.createElement("option");
      opt.value = level;
      opt.textContent = LEVEL_LABELS[level] || level;
      levelSelect.appendChild(opt);
    }
    levelSelect.value = AVAILABLE_LEVELS.includes(DEFAULT_LEVEL)
      ? DEFAULT_LEVEL
      : AVAILABLE_LEVELS[0];

    let activeSource = null;
    let activeLayers = [];
    let activeAttrs = null;

    function setStatus(text) {
      document.getElementById("status").textContent = text;
    }

    function clearActiveLayers() {
      for (const id of activeLayers) {
        if (map.getLayer(id)) map.removeLayer(id);
      }
      activeLayers = [];
      if (activeSource && map.getSource(activeSource)) map.removeSource(activeSource);
      activeSource = null;
      activeAttrs = null;
    }

    function colorExpression() {
      return [
        "interpolate", ["linear"],
        ["coalesce", ["to-number", ["get", "robotability_score_01"]], 0],
        0, lerpColor(0),
        0.25, lerpColor(0.25),
        0.5, lerpColor(0.5),
        0.75, lerpColor(0.75),
        1, lerpColor(1),
      ];
    }

    async function loadLevel(level) {
      setStatus(`Loading ${LEVEL_LABELS[level] || level}…`);
      clearActiveLayers();
      const [geoRes, attrsRes] = await Promise.all([
        fetch(`./${level}.geojson`),
        fetch(`./${level}.attrs.json`),
      ]);
      if (!geoRes.ok) throw new Error(`Failed to load ${level}.geojson (${geoRes.status})`);
      if (!attrsRes.ok) throw new Error(`Failed to load ${level}.attrs.json (${attrsRes.status})`);
      const data = await geoRes.json();
      const attrs = await attrsRes.json();
      attrs.idIndex = Object.fromEntries(attrs.ids.map((id, i) => [String(id), i]));
      activeAttrs = attrs;

      const n = (data.features || []).length;
      const sourceId = `robotability-${level}`;
      activeSource = sourceId;
      map.addSource(sourceId, { type: "geojson", data, generateId: true });

      const isPoints = level === "sidewalk_segmentized";
      if (isPoints) {
        const layerId = `${sourceId}-circle`;
        map.addLayer({
          id: layerId,
          type: "circle",
          source: sourceId,
          paint: {
            "circle-radius": [
              "interpolate", ["linear"], ["zoom"],
              10, 1.2, 13, 2.5, 16, 5
            ],
            "circle-color": colorExpression(),
            "circle-opacity": 0.85,
            "circle-stroke-width": 0,
          },
        });
        activeLayers = [layerId];
      } else {
        const fillId = `${sourceId}-fill`;
        const lineId = `${sourceId}-line`;
        map.addLayer({
          id: fillId,
          type: "fill",
          source: sourceId,
          paint: {
            "fill-color": colorExpression(),
            "fill-opacity": 0.72,
          },
        });
        map.addLayer({
          id: lineId,
          type: "line",
          source: sourceId,
          paint: {
            "line-color": "#0b0d12",
            "line-width": level === "sidewalk_full" ? 0.15 : 0.6,
            "line-opacity": 0.55,
          },
        });
        activeLayers = [fillId, lineId];
      }

      const bounds = new maplibregl.LngLatBounds();
      for (const f of data.features) {
        if (f.geometry) extendBounds(bounds, f.geometry.coordinates);
      }
      if (!bounds.isEmpty()) {
        map.fitBounds(bounds, {
          padding: 40,
          maxZoom: isPoints ? 13.5 : 14,
          duration: 500,
        });
      }
      setStatus(`${LEVEL_LABELS[level] || level} · ${n.toLocaleString()} features`);
      document.getElementById("detail").innerHTML =
        `<p class="placeholder">Click a feature to inspect raw and 0–1 values for all CSV columns.</p>`;
    }

    map.on("load", () => {
      loadLevel(levelSelect.value).catch((err) => setStatus(String(err)));
    });
    levelSelect.addEventListener("change", () => {
      loadLevel(levelSelect.value).catch((err) => setStatus(String(err)));
    });

    map.on("click", (e) => {
      if (!activeLayers.length) return;
      const hits = map.queryRenderedFeatures(e.point, { layers: activeLayers });
      if (!hits.length) return;
      const hitProps = hits[0].properties || {};
      const detail = rowFromAttrs(activeAttrs, hitProps.feature_id, hitProps);
      renderDetail(detail || {
        feature_id: hitProps.feature_id,
        feature_label: hitProps.feature_label,
        robotability_score: hitProps.robotability_score,
        robotability_score_01: hitProps.robotability_score_01,
        values: {},
        values_01: {},
      });
    });

    map.on("mousemove", (e) => {
      if (!activeLayers.length) {
        map.getCanvas().style.cursor = "";
        return;
      }
      const hits = map.queryRenderedFeatures(e.point, { layers: activeLayers });
      map.getCanvas().style.cursor = hits.length ? "pointer" : "";
    });
  </script>
</body>
</html>
